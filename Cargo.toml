[workspace]
members = [".", "src-tauri", "xc-lib", "xc-cli", "oversample-core", "oversample-ipc", "chime", "birdnet-worker"]

[package]
name = "oversample"
version = "0.5.109"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oversample-core = { path = "oversample-core" }
oversample-ipc = { path = "oversample-ipc" }
# Parsing, query and species-list helpers only; no reqwest/tokio in WASM.
xc-lib = { path = "xc-lib", default-features = false }
leptos = { version = "0.8", features = ["csr"] }
reactive_stores = "0.4.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "ImageData",
    "AudioContext",
    "AudioContextState",
    "AudioContextOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
    "AudioParam",
    "AudioDestinationNode",
    "AudioNode",
    "BaseAudioContext",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "File",
    "FileReader",
    "FileReaderSync",
    "Blob",
    "Url",
    "HtmlInputElement",
    "MouseEvent",
    "PointerEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "WheelEvent",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "Performance",
    "TextMetrics",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    "RequestInit",
    "Navigator",
    "Clipboard",
    "History",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaStreamAudioSourceNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemCreateWritableOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "Storage",
    "NodeList",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "ScrollLogicalPosition",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "Worker",
    "MessageEvent",
    "ErrorEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
send_wrapper = "0.6"
realfft = "3"
claxon = "0.4"
lewton = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "isomp4", "aac", "alac", "all-meta"] }
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
yaml_serde = "0.10"
sha2 = "0.11"
blake3 = { version = "1", default-features = false }
futures-channel = "0.3"

[profile.release]
opt-level = "s"
lto = true

# The BirdNET worker: tract is much slower at opt-level "s" than at 3. Only
# crates the app's own bundle does not use are listed, so the app's code is not
# affected. Generic code (ndarray, num-traits) is compiled in the crate that
# instantiates it, so the tract crates carry most of it.
# Checked with LTO on (2026-11-11, headless Chrome, a busy machine): the worker
# built this way took 175 ms per BirdNET window; with these packages set back to
# "s" it took 250 ms. So the overrides do take effect through LTO.
[profile.release.package.birdnet-worker]
opt-level = 3
[profile.release.package.rubato]
opt-level = 3
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.tract-hir]
opt-level = 3
[profile.release.package.tract-nnef]
opt-level = 3
[profile.release.package.tract-onnx]
opt-level = 3
[profile.release.package.tract-onnx-opl]
opt-level = 3
[profile.release.package.tract-extra]
opt-level = 3
[profile.release.package.tract-transformers]
opt-level = 3
[profile.release.package.ndarray]
opt-level = 3
[profile.release.package.matrixmultiply]
opt-level = 3
[profile.release.package.half]
opt-level = 3
