name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      # Link the wasm with --strip-all to drop the `name` section (function
      # names): 48 MB of the app's 60 MB wasm and 6.6 MB of the BirdNET
      # worker's 23 MB. Panic messages keep their file:line, but stack frames
      # show as wasm-function[N]. To find the function behind N, build the
      # same commit locally without these flags: it has the same functions in
      # the same order, with names.
      # --strip-all also drops `target_features`, which wasm-bindgen reads to
      # turn on externref and multivalue, so that section is kept.
      # This variable adds to the flags in .cargo/config.toml (simd128);
      # RUSTFLAGS would replace them.
      # CARGO_PROFILE_RELEASE_STRIP would not reach birdnet-worker: Cargo
      # ignores the base profile's strip for a package with its own override.
      - name: Build
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C link-arg=--strip-all -C link-arg=--keep-section=target_features
        run: trunk build --release --public-url / --dist docs

      - name: Bypass Jekyll
        run: touch docs/.nojekyll

      - name: Add CNAME
        run: echo 'app.oversample.com' > docs/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
