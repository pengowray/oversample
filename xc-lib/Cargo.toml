[package]
name = "xc-lib"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Xeno-Canto API v3 client library with caching"

[features]
default = ["http"]
# Network client (reqwest + rustls + tokio timers). Turn off for the WASM
# frontend, which only needs the parsing and taxonomy helpers.
http = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
oversample-ipc = { path = "../oversample-ipc" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
sha2 = "0.11"
blake3 = "1"
