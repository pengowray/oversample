[package]
name = "birdnet-worker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "BirdNET and BattyBirdNET engine for Oversample: resampling, windowing and tract inference, run in a Web Worker"

# Trunk builds this crate as a Web Worker (`data-type="worker"` in index.html).
# The rlib is for the native tests.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["worker"]
# The Web Worker entry point (`#[wasm_bindgen(start)]`). Off for crates that use
# the models as a library in their own WASM build, such as research/perch-bench.
worker = []

[dependencies]
oversample-ipc = { path = "../oversample-ipc" }
tract-onnx = "0.23"
# Band-limited resampling to the models' rates. Default features include the FFT
# resampler.
rubato = "5"

# The browser target. tract-onnx's default features pull in getrandom 0.4, which needs
# its wasm_js backend on wasm32-unknown-unknown.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "WorkerGlobalScope",
    "Performance",
    "console",
] }

[dev-dependencies]
oversample-core = { path = "../oversample-core" }
